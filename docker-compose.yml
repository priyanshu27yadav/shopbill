version: '3.8'

services:
  # SHOPBILL Unified App (React Frontend + Laravel 11 Backend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopbill_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "ShopBill"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: shopbill_db
      DB_USERNAME: shopbill_user
      DB_PASSWORD: shopbill_secret_password
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage/app/public

  # MySQL 8.0 Production Database
  db:
    image: mysql:8.0
    container_name: shopbill_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: shopbill_db
      MYSQL_USER: shopbill_user
      MYSQL_PASSWORD: shopbill_secret_password
      MYSQL_ROOT_PASSWORD: root_secret_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional phpMyAdmin for easy database inspection
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: shopbill_pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_secret_password
    depends_on:
      - db

volumes:
  mysql_data:
    driver: local
  storage_data:
    driver: local
