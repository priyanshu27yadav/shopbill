# ========================================================
# SHOPBILL v1.0 - Render.com Blueprint Specification
# Unified Web Application connected to Supabase PostgreSQL
# ========================================================

services:
  # SHOPBILL Unified Web Application (React Frontend + Laravel 11 Backend)
  - type: web
    name: shopbill
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_NAME
        value: ShopBill
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-0-ap-northeast-2.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres.uscvhmednjgqmargftyh
      - key: DB_PASSWORD
        value: "Riyan@292002"
      - key: DB_SSLMODE
        value: require
      - key: SEED_DATABASE
        value: "false"
